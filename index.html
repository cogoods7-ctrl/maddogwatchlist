<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchlist</title>
<style id="css">
:root{
  --bg:#0d0d10;--panel:#16161b;--panel2:#1d1d24;--line:#2a2a33;
  --text:#ececf1;--muted:#8b8b98;--accent:#e8b04a;--tv:#6aa7ff;--good:#5fcf8a;--bad:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:34px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.stats{color:var(--muted);font-size:14px}
.stats b{color:var(--text)}
.btn{background:var(--accent);color:#141414;border:0;border-radius:10px;padding:10px 16px;font-weight:650;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;
  position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.search{flex:1 1 240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;outline:none}
.search:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;cursor:pointer;user-select:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;
  display:flex;flex-direction:column;gap:10px;position:relative;transition:border-color .15s}
.card:hover{border-color:#3a3a46}
.card.watched{opacity:.5}
.card.watched .t{text-decoration:line-through}
.t{font-weight:650;font-size:16px;line-height:1.25;padding-right:22px}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.pill.movie{color:var(--accent);border-color:#5a4724}
.pill.tv{color:var(--tv);border-color:#2a4166}
.score{margin-left:auto;font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px}
.score .s{color:var(--accent)}
.score.none{color:var(--muted);font-weight:500;font-size:12px}
.acts{display:flex;gap:6px;margin-top:auto}
.acts button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;
  font-size:12px;color:var(--muted);cursor:pointer}
.acts button:hover{color:var(--text);border-color:#3a3a46}
.acts button.w.on{color:var(--good);border-color:#2b5a3e}
.new{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:420px}
.box h2{margin:0 0 16px;font-size:20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field span{font-size:13px;color:var(--muted)}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.row{display:flex;gap:10px}.row .field{flex:1}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:-4px 0 10px}
.foot{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.note{color:var(--muted);font-size:12px;margin-top:30px;text-align:center}
</style>
</head>

<script id="app">
(function(){
  var items = JSON.parse(document.getElementById('seed').textContent);
  var state = {q:'', type:'all', sort:'added', hideWatched:false};
  try{ var saved = JSON.parse(localStorage.getItem('wl-view')||'null'); if(saved) Object.assign(state, saved, {q:''}); }catch(e){}
  var artifact = null, canSave = false, lastAdded = null;
  var RATINGS = {movie:['G','PG','PG-13','R','NC-17','NR'], tv:['TV-Y','TV-Y7','TV-G','TV-PG','TV-14','TV-MA','NR']};

  var root = document.getElementById('root');
  root.innerHTML =
   '<div class="wrap">'+
    '<header><div><h1>My <span>Watchlist</span></h1><div class="stats" id="stats"></div></div>'+
    '<button class="btn" id="addBtn">+ Add title</button></header>'+
    '<div class="bar">'+
     '<input class="search" id="q" placeholder="Search titles…" autocomplete="off">'+
     '<div class="seg" id="seg"><button data-t="all">All</button><button data-t="movie">Movies</button><button data-t="tv">TV Shows</button></div>'+
     '<select id="sort"><option value="added">Recently added</option><option value="rating">Highest rated</option><option value="title">A → Z</option><option value="list">List order</option></select>'+
     '<label class="chk"><input type="checkbox" id="hw"> Hide watched</label>'+
    '</div>'+
    '<div class="grid" id="grid"></div>'+
    '<div class="note" id="note"></div>'+
   '</div>'+
   '<div class="modal" id="modal"><form class="box" id="form">'+
    '<h2>Add to watchlist</h2>'+
    '<label class="field"><span>Title</span><input id="fTitle" required maxlength="120"></label>'+
    '<div class="row">'+
     '<label class="field"><span>Type</span><select id="fType"><option value="movie">Movie</option><option value="tv">TV Show</option></select></label>'+
     '<label class="field"><span>Content rating</span><select id="fRated"></select></label>'+
    '</div>'+
    '<label class="field"><span>Score (0–5, optional)</span><input id="fScore" type="number" min="0" max="5" step="0.1" placeholder="e.g. 3.8"></label>'+
    '<div class="err" id="fErr"></div>'+
    '<div class="foot"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn" type="submit">Add</button></div>'+
   '</form></div>'+
   '<div class="modal" id="confirm"><div class="box"><h2 id="cMsg"></h2>'+
    '<div class="foot"><button class="btn ghost" id="cNo">Cancel</button><button class="btn danger" id="cYes">Remove</button></div></div></div>'+
   '<div class="toast" id="toast"></div>';

  function $(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function norm(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'')}
  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2200)}
  function saveView(){try{localStorage.setItem('wl-view',JSON.stringify({type:state.type,sort:state.sort,hideWatched:state.hideWatched}))}catch(e){}}

  function render(){
    var q = norm(state.q);
    var list = items.map(function(it,i){return {it:it,i:i}}).filter(function(o){
      var it=o.it;
      if(state.type!=='all' && it.type!==state.type) return false;
      if(state.hideWatched && it.watched) return false;
      if(q && norm(it.title).indexOf(q)<0) return false;
      return true;
    });
    list.sort(function(a,b){
      if(state.sort==='rating') return (b.it.rating||0)-(a.it.rating||0) || a.it.title.localeCompare(b.it.title);
      if(state.sort==='title') return a.it.title.replace(/^(the|a|an)\s+/i,'').localeCompare(b.it.title.replace(/^(the|a|an)\s+/i,''));
      if(state.sort==='added') return (b.it.added||0)-(a.it.added||0) || a.i-b.i;
      return a.i-b.i;
    });
    var m=items.filter(function(x){return x.type==='movie'}).length, tv=items.length-m, w=items.filter(function(x){return x.watched}).length;
    $('stats').innerHTML='<b>'+m+'</b> movies · <b>'+tv+'</b> shows'+(w?' · <b>'+w+'</b> watched':'')+(list.length!==items.length?' · showing '+list.length:'');
    $('grid').innerHTML = list.length ? list.map(function(o){
      var it=o.it, has=it.rating>0;
      return '<div class="card'+(it.watched?' watched':'')+'">'+
        (it.id===lastAdded?'<div class="new" title="Just added"></div>':'')+
        '<div class="t">'+esc(it.title)+'</div>'+
        '<div class="meta"><span class="pill '+it.type+'">'+(it.type==='tv'?'TV':'Movie')+'</span>'+
        (it.rated?'<span class="pill">'+esc(it.rated)+'</span>':'')+
        (has?'<span class="score"><span class="s">★</span>'+it.rating.toFixed(1)+'</span>':'<span class="score none">No score</span>')+'</div>'+
        '<div class="acts"><button class="w'+(it.watched?' on':'')+'" data-w="'+it.id+'">'+(it.watched?'✓ Watched':'Mark watched')+'</button>'+
        '<button data-d="'+it.id+'">Remove</button></div></div>';
    }).join('') : '<div class="empty">'+(items.length?'Nothing matches.':'Your watchlist is empty.')+'</div>';
    [].forEach.call($('seg').children,function(b){b.classList.toggle('on',b.dataset.t===state.type)});
    $('sort').value=state.sort; $('hw').checked=state.hideWatched;
  }

  // Rebuild the full document with current data and publish it as the new version.
  function buildDoc(){
    var json = JSON.stringify(items).replace(/</g,'\\u003c');
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Watchlist</title>\n'+
      '<style id="css">'+$('css').textContent+'</style>\n</head>\n<body>\n<div id="root"></div>\n'+
      '<script id="seed" type="application/json">'+json+'<\/script>\n'+
      '<script id="app">'+$('app').textContent+'<\/script>\n</body>\n</html>\n';
  }
  var pending=null;
  function persist(){
    if(!artifact){ toast('Changes won’t be saved in this view'); return; }
    clearTimeout(pending);
    pending=setTimeout(function(){
      artifact.publish(buildDoc()).catch(function(e){
        var c=(e&&(e.code||e.name||e.message))||'';
        if(/not_granted|not_writer/.test(c)){canSave=false;toast('This view is read-only');}
        else if(!/conflict/.test(c)) toast('Couldn’t save — try again');
      });
    },600);
  }

  // Controls
  $('q').addEventListener('input',function(e){state.q=e.target.value;render()});
  $('seg').addEventListener('click',function(e){var t=e.target.dataset.t;if(t){state.type=t;saveView();render()}});
  $('sort').addEventListener('change',function(e){state.sort=e.target.value;saveView();render()});
  $('hw').addEventListener('change',function(e){state.hideWatched=e.target.checked;saveView();render()});

  // Add form
  function fillRated(){var t=$('fType').value;$('fRated').innerHTML=RATINGS[t].map(function(r){return '<option>'+r+'</option>'}).join('');$('fRated').value=t==='tv'?'TV-14':'PG-13'}
  $('fType').addEventListener('change',fillRated);
  function openAdd(){$('form').reset();$('fErr').textContent='';fillRated();$('modal').classList.add('open');setTimeout(function(){$('fTitle').focus()},30)}
  function closeAll(){$('modal').classList.remove('open');$('confirm').classList.remove('open')}
  $('addBtn').addEventListener('click',openAdd);
  $('cancel').addEventListener('click',closeAll);
  [$('modal'),$('confirm')].forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)closeAll()})});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')closeAll();
    if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('q').focus()}
  });
  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    var title=$('fTitle').value.trim(), type=$('fType').value, rated=$('fRated').value, s=$('fScore').value;
    if(!title){$('fErr').textContent='Enter a title.';return}
    var score = s===''?0:Math.round(parseFloat(s)*10)/10;
    if(isNaN(score)||score<0||score>5){$('fErr').textContent='Score must be between 0 and 5.';return}
    var dup = items.some(function(x){return norm(x.title)===norm(title)&&x.type===type});
    if(dup && !$('form').dataset.ok){$('fErr').textContent='That title is already on your list. Press Add again to add it anyway.';$('form').dataset.ok='1';return}
    delete $('form').dataset.ok;
    var id=Date.now().toString(36);
    items.push({id:id,title:title,type:type,rating:score,rated:rated,added:Date.now()});
    lastAdded=id; closeAll();
    if(state.type!=='all'&&state.type!==type) state.type=type;
    state.sort='added'; state.q=''; $('q').value='';
    render(); toast('Added “'+title+'”'); persist();
  });
  $('fTitle').addEventListener('input',function(){delete $('form').dataset.ok;$('fErr').textContent=''});

  // Card actions
  var toRemove=null;
  $('grid').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.w){var it=items.find(function(x){return x.id===b.dataset.w});it.watched=!it.watched;if(!it.watched)delete it.watched;render();persist()}
    if(b.dataset.d){toRemove=b.dataset.d;var it2=items.find(function(x){return x.id===toRemove});$('cMsg').textContent='Remove “'+it2.title+'”?';$('confirm').classList.add('open')}
  });
  $('cNo').addEventListener('click',closeAll);
  $('cYes').addEventListener('click',function(){
    var i=items.findIndex(function(x){return x.id===toRemove}); if(i<0)return;
    var t=items[i].title; items.splice(i,1); closeAll(); render(); toast('Removed “'+t+'”'); persist();
  });

  render();
  if(window.claude && claude.use){
    claude.use('artifact').then(function(a){
      artifact=a; canSave=!!a;
      if(!a) $('note').textContent='Saving isn’t available in this view — open the page on claude.ai to make changes stick.';
    });
  } else {
    $('note').textContent='Saving isn’t available in this view.';
  }
})();
</script>
